name: H1 122 PR Body Actor Confusion

on:
  pull_request_target:
    types: [opened, labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install fake Claude executable
        run: |
          mkdir -p "$RUNNER_TEMP/fake-bin"
          cat > "$RUNNER_TEMP/fake-bin/claude" <<'SH'
          #!/usr/bin/env bash
          cat > "${RUNNER_TEMP:-/tmp}/h1-122-fake-claude-stdin.jsonl"
          echo '{"type":"system","subtype":"init","model":"fake-local"}'
          echo '{"type":"result","subtype":"success","is_error":false,"duration_ms":1,"duration_api_ms":0,"num_turns":0,"total_cost_usd":0}'
          SH
          chmod +x "$RUNNER_TEMP/fake-bin/claude"
          echo "FAKE_CLAUDE=$RUNNER_TEMP/fake-bin/claude" >> "$GITHUB_ENV"
      - uses: anthropics/claude-code-action@v1.0.189
        with:
          track_progress: true
          anthropic_api_key: dummy-local-only
          github_token: ${{ github.token }}
          show_full_output: true
          path_to_claude_code_executable: ${{ env.FAKE_CLAUDE }}
      - name: Assert fake Claude stdin marker
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/h1-122-fake-claude-stdin.jsonl" ]; then
            grep -F "H1_SAFE_PR_BODY_ACTOR_CONFUSION_122" "$RUNNER_TEMP/h1-122-fake-claude-stdin.jsonl"
          else
            echo "fake Claude stdin was not written"
          fi
